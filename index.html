<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>자동 브리핑 리포트</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f7fa;font-family:"Malgun Gothic","Segoe UI",sans-serif;color:#17212b}
    .wrap{max-width:540px;margin:0 auto;padding:48px 20px}
    h1{font-size:24px;margin:0 0 6px}
    .sub{color:#667085;font-size:14px;margin-bottom:32px}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
    .card{background:#fff;border:1px solid #d9e0e8;border-radius:10px;padding:24px 20px;text-decoration:none;color:inherit;transition:box-shadow .15s}
    .card:hover{box-shadow:0 4px 16px rgba(0,0,0,.10)}
    .icon{font-size:32px;margin-bottom:10px}
    .card h2{font-size:16px;margin:0 0 6px}
    .card p{font-size:13px;color:#667085;margin:0}
    .foot{margin-top:32px;font-size:12px;color:#aaa;text-align:center}
    @media(max-width:480px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <h1>📊 브리핑 리포트</h1>
  <div class="sub">자동 생성 데이터 브리핑</div>
  <div class="grid">
    <a class="card" href="economy.html">
      <div class="icon">🛢️</div>
      <h2>경제 데이터</h2>
      <p>WTI · Brent · USD/KRW · USD/VND · BDI · 철강</p>
    </a>
    <a class="card" href="pile-report.html">
      <div class="icon">🏭</div>
      <h2>PILE 월간 보고서</h2>
      <p>VGSI PILE 생산 · 품질 · 안전 월간 현황</p>
    </a>
  </div>
  <div class="foot">자동 배포 · GitHub Pages</div>
</div>
</body>
</html>
